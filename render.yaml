databases:
  - name: reprobug-db
    plan: free
    databaseName: reprobug
    user: reprobug

services:
  - type: web
    name: reprobug-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate --workspace=server
    startCommand: npm run db:deploy --workspace=server && npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reprobug-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://reprobug-dashboard.onrender.com

  - type: web
    name: reprobug-dashboard
    runtime: static
    buildCommand: npm install && npm run build --workspace=client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reprobug-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
