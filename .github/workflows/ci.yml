name: ReproBug CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, migrate, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprobug
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reprobug"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprobug?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate --schema server/prisma/schema.prisma
      - name: Generate Prisma Client
        run: npm run db:generate --workspace=server
      - name: Apply database migrations
        run: npm run db:deploy --workspace=server
      - name: Run backend unit tests
        run: npm run test:unit --workspace=server
      - name: Run API integration tests
        run: npm run test:integration --workspace=server
      - name: Build React frontend
        run: npm run build
