name: ReproBug CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate schema and build frontend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprobug?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run backend unit tests
        run: npm test --workspace=server
      - name: Validate Prisma schema
        run: npx prisma validate --schema server/prisma/schema.prisma
      - name: Generate Prisma Client
        run: npm run db:generate --workspace=server
      - name: Build React frontend
        run: npm run build
